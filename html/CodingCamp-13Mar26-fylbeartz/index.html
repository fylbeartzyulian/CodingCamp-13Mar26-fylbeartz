<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Greeting Section -->
        <section class="greeting-section">
            <div class="greeting-emoji">👋</div>
            <h1 id="greeting">Good morning</h1>
            <p id="datetime"></p>
            <input type="text" id="nameInput" placeholder="Enter your name" class="name-input">
        </section>

        <!-- Focus Timer Section -->
        <section class="timer-section">
            <h2>⏱️ Focus Timer</h2>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button id="startBtn" class="btn btn-primary btn-lg">▶️ Start</button>
                <button id="stopBtn" class="btn btn-secondary btn-lg">⏸️ Stop</button>
                <button id="resetBtn" class="btn btn-secondary btn-lg">🔄 Reset</button>
            </div>
            <div class="timer-settings">
                <label for="timerInput">⚙️ Custom time (minutes):</label>
                <div class="timer-input-group">
                    <input type="number" id="timerInput" min="1" max="60" value="25" class="timer-input">
                    <button id="setTimerBtn" class="btn btn-small btn-primary">Set</button>
                </div>
            </div>
        </section>

        <!-- To-Do List Section -->
        <section class="todo-section">
            <h2>✓ To-Do List</h2>
            <div class="todo-input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." class="task-input">
                <button id="addTaskBtn" class="btn btn-primary btn-lg">➕ Add</button>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="links-section">
            <h2>🔗 Quick Links</h2>
            <div class="links-input-group">
                <input type="text" id="linkName" placeholder="Link name" class="link-input">
                <input type="url" id="linkUrl" placeholder="https://example.com" class="link-input">
                <button id="addLinkBtn" class="btn btn-primary btn-lg">➕ Add Link</button>
            </div>
            <div id="linksList" class="links-list"></div>
        </section>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
